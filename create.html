h:100%;max-width:320px;margin:14px auto 0;padding:14px 12px;border:2px solid #ffffff88;border-radius:50px;background:linear-gradient(100deg,var(--ac),#9d4edd);color:#fff;font:800 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 22px var(--ac)}\n.btn.gh{background:#ffffff18;box-shadow:none;font-weight:600}\n.hearts{position:fixed;pointer-events:none;z-index:65;animation:rise 3s ease-out forwards}\n@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-85vh) rotate(380deg) scale(1.4);opacity:0}}\n#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:80;width:38px;height:38px;border-radius:50%;border:1px solid #fff5;background:#0006;color:#fff;font-size:17px;cursor:pointer}\n#now{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;padding:6px 14px;border-radius:30px;background:#000a;font:12px system-ui,sans-serif;color:#ffe9a8;opacity:0;transition:opacity .5s;white-space:nowrap}\n#now.on{opacity:1}\n#st0{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,var(--b1),#05030a);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}\n\n/* ===== KITABU ===== */\n.row{display:flex;gap:10px;justify-content:center}\n.page{min-height:250px;padding:10px 4px;animation:fl .6s ease-out}\n@keyframes fl{from{opacity:0;transform:perspective(700px) rotateY(-70deg)}to{opacity:1;transform:none}}\n.dots{letter-spacing:6px;font-size:12px;opacity:.8;margin-top:6px}\n.emo{display:inline-block;-webkit-text-fill-color:initial;color:#fff;background:none}\n\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv id=\"stars\"\u003e\u003c/div\u003e\u003ccanvas id=\"fw\"\u003e\u003c/canvas\u003e\n\u003cbutton id=\"mute\" type=\"button\" style=\"display:none\" aria-label=\"Sauti\"\u003e🔊\u003c/button\u003e\u003cdiv id=\"now\"\u003e\u003c/div\u003e\n\u003cdiv id=\"app\"\u003e\u003c/div\u003e\u003cdiv id=\"st0\"\u003e\u003c/div\u003e\n\u003cscript\u003e\n// ===== INJINI YA MUZIKI NA FATAKI (partials/engine.js) =====\n/* Injini ya muziki + fataki + mioyo. Inatumika na zawadi zote. */\nconst $=id=\u003edocument.getElementById(id);\nconst rnd=(a,b)=\u003ea+Math.random()*(b-a);\nfor(let i=0;i\u003c90;i++){const s=document.createElement(\"i\");s.className=\"st\";const z=rnd(1,3);Object.assign(s.style,{width:z+\"px\",height:z+\"px\",left:rnd(0,100)+\"%\",top:rnd(0,100)+\"%\",animationDelay:rnd(0,3)+\"s\"});$(\"stars\").appendChild(s)}\n\n/* ===== MUSIC ===== */\nconst TR=[\n {n:\"Mapenzi\",bpm:66,root:65,sc:[0,2,4,5,7,9,11],ch:[[53,57,60],[50,53,57],[58,62,65],[48,52,55]],arp:\"0.1.2.3.2.1.0.1.\",mel:\"x.....x...x.....\",aw:\"sine\",mw:\"triangle\",v:.07},\n {n:\"Ndoto Tamu\",bpm:72,root:69,sc:[0,3,5,7,10],ch:[[57,60,64],[53,57,60],[48,52,55],[52,55,59]],arp:\"0.1.2.1.3.2.1.0.\",mel:\"x...x.x.....x...\",aw:\"triangle\",mw:\"sine\",v:.05},\n {n:\"Lala Salama\",bpm:56,root:74,sc:[0,2,4,7,9],ch:[[57,61,64],[55,59,62],[59,62,66],[52,56,59]],arp:\"3.4.5.4.3.4.5.4.\",mel:\"x.......x.......\",aw:\"triangle\",mw:\"sine\",v:.06}\n];\nlet AC,master,dIn,nb,bus,timer,step=0,nextT=0,walk=0,muted=false,tn=0;\nconst mtof=m=\u003e440*Math.pow(2,(m-69)/12);\nfunction initA(){\n  AC=new(window.AudioContext||window.webkitAudioContext)();\n  master=AC.createGain();master.gain.value=.85;\n  const c=AC.createDynamicsCompressor();master.connect(c);c.connect(AC.destination);\n  const d=AC.createDelay(1);d.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.38;\n  const lp=AC.createBiquadFilter();lp.frequency.value=2600;\n  dIn=AC.createGain();dIn.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(master);\n  nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i\u003ca.length;i++)a[i]=Math.random()*2-1;\n}\nfunction note(f,t,d,ty,v,o,a=.015){const os=AC.createOscillator(),g=AC.createGain();os.type=ty;os.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o);os.start(t);os.stop(t+d+.05)}\nfunction noise(t,d,ty,fr,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=ty;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05)}\nfunction pstep(T,o,s,t){\n  const i=s%16,ch=T.ch[Math.floor(s/16)%4],b=60/T.bpm;\n  if(i===0){ch.forEach(m=\u003e{note(mtof(m),t,b*4,\"sine\",T.v*.8,o,.5);note(mtof(m+12),t,b*4,\"triangle\",T.v*.3,o,.6)});note(mtof(ch[0]-12),t,b*3,\"sine\",.2,o,.05)}\n  const a=T.arp[i];\n  if(a!==\".\"){const n=+a,m=ch[n%3]+12*(1+Math.floor(n/3));note(mtof(m),t,b*.9,T.aw,T.v,o);note(mtof(m),t+b*.33,b*.6,T.aw,T.v*.4,dIn)}\n  if(T.mel[i]===\"x\"){walk+=[-2,-1,1,2,0,1][Math.random()*6|0];walk=Math.max(0,Math.min(T.sc.length*2-1,walk));\n    const m=T.root+T.sc[walk%T.sc.length]+12*Math.floor(walk/T.sc.length);note(mtof(m),t,b*1.7,T.mw,T.v*1.3,o);note(mtof(m),t,b*1.7,T.mw,T.v*.7,dIn)}\n}\nfunction play(i){\n  if(!AC)initA();if(AC.state===\"suspended\")AC.resume();\n  const T=TR[i%TR.length],now=AC.currentTime;\n  if(bus){const ob=bus;ob.gain.setValueAtTime(ob.gain.value,now);ob.gain.linearRampToValueAtTime(0,now+1);setTimeout(()=\u003eob.disconnect(),1300)}\n  clearInterval(timer);\n  const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(1,now+1.2);g.connect(master);bus=g;\n  step=0;walk=2;nextT=now+.1;\n  timer=setInterval(()=\u003e{while(nextT\u003cAC.currentTime+.2){pstep(T,g,step,nextT+(step%2?.012:0));nextT+=60/T.bpm/4;step++}},25);\n  toast(\"🎵 \"+T.n);\n}\nlet tt;function toast(m){const e=$(\"now\");e.textContent=m;e.classList.add(\"on\");clearTimeout(tt);tt=setTimeout(()=\u003ee.classList.remove(\"on\"),2500)}\n$(\"mute\").onclick=()=\u003e{muted=!muted;master.gain.setTargetAtTime(muted?0:.85,AC.currentTime,.05);$(\"mute\").textContent=muted?\"🔇\":\"🔊\"};\n\n/* ===== FIREWORKS ===== */\nconst fc=$(\"fw\"),fx=fc.getContext(\"2d\");let W,H,P=[],R=[],pend=0,run=false;\nfunction size(){const d=Math.min(devicePixelRatio||1,2);fc.width=innerWidth*d;fc.height=innerHeight*d;fx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}\naddEventListener(\"resize\",size);size();\nfunction boomS(){if(!AC||muted)return;const t=AC.currentTime;noise(t,.7,\"lowpass\",420,.5);const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+.4);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+.55);for(let k=0;k\u003c4;k++)noise(t+.15+Math.random()*.5,.04,\"highpass\",5000,.15)}\nfunction launch(){R.push({x:W*rnd(.15,.85),y:H,vx:rnd(-.6,.6),vy:-rnd(9,12),ty:H*rnd(.12,.45),h:rnd(0,360)})}\nfunction boom(x,y,hue){\n  const ty=[\"peony\",\"ring\",\"heart\",\"willow\",\"double\",\"crackle\",\"spiral\"][Math.random()*7|0],n=ty===\"heart\"?80:100;\n  const add=(vx,vy,h,o={})=\u003eP.push({x,y,px:x,py:y,vx,vy,l:1,d:o.d||rnd(.011,.019),g:o.g??.04,f:o.f||.972,h,w:o.w||2.2,tw:o.tw});\n  for(let i=0;i\u003cn;i++){const a=Math.PI*2*i/n,c=Math.cos(a),s=Math.sin(a);\n    if(ty===\"peony\"){const k=rnd(1.5,6);add(c*k,s*k,hue+rnd(0,30))}\n    else if(ty===\"ring\")add(c*5,s*5,hue,{f:.968});\n    else if(ty===\"heart\"){add(16*s*s*s*.3,-(13*c-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*.3,340+rnd(0,20),{f:.975,g:.02,d:.009,w:2.6})}\n    else if(ty===\"willow\"){const k=rnd(1,4.6);add(c*k,s*k,42,{g:.035,d:.005,f:.982,w:1.8})}\n    else if(ty===\"double\"){add(c*2.4,s*2.4,hue);add(c*5,s*5,hue+150)}\n    else if(ty===\"crackle\"){const k=rnd(1.5,6);add(c*k,s*k,hue,{tw:1,d:.01})}\n    else{const k=1+i/n*5,b=a*3;add(Math.cos(b)*k,Math.sin(b)*k,hue+i*3,{f:.97})}}\n  boomS();\n}\nfunction loop(){\n  fx.globalCompositeOperation=\"destination-out\";fx.fillStyle=\"rgba(0,0,0,.2)\";fx.fillRect(0,0,W,H);\n  fx.globalCompositeOperation=\"lighter\";fx.lineCap=\"round\";\n  for(let i=R.length-1;i\u003e=0;i--){const r=R[i],px=r.x,py=r.y;r.x+=r.vx;r.y+=r.vy;r.vy*=.985;\n    fx.strokeStyle=\"hsla(40,100%,75%,.9)\";fx.lineWidth=2.5;fx.beginPath();fx.moveTo(px,py);fx.lineTo(r.x,r.y);fx.stroke();\n    P.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:rnd(-.3,.3),vy:rnd(0,.6),l:.6,d:.04,g:.02,f:.95,h:35,w:1.4});\n    if(r.y\u003c=r.ty||r.vy\u003e-1.5){boom(r.x,r.y,r.h);R.splice(i,1)}}\n  for(let i=P.length-1;i\u003e=0;i--){const p=P[i];p.px=p.x;p.py=p.y;p.vx*=p.f;p.vy*=p.f;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;\n    if(p.l\u003c=0){P.splice(i,1);continue}\n    const a=p.tw\u0026\u0026Math.random()\u003c.4?.1:Math.min(1,p.l*1.4);\n    fx.strokeStyle=\"hsla(\"+p.h+\",100%,\"+(55+p.l*25)+\"%,\"+a+\")\";fx.lineWidth=p.w*p.l+.4;fx.beginPath();fx.moveTo(p.px,p.py);fx.lineTo(p.x,p.y);fx.stroke()}\n  if(R.length||P.length||pend\u003e0)requestAnimationFrame(loop);else{fx.clearRect(0,0,W,H);run=false}\n}\nfunction fireworks(n=7){size();for(let k=0;k\u003cn;k++){pend++;setTimeout(()=\u003e{launch();pend--},k*380+rnd(0,250))}if(!run){run=true;requestAnimationFrame(loop)}}\nfunction hearts(n=30){const s=[\"💖\",\"🌸\",\"✨\",\"⭐\",\"🎉\",\"💙\",\"🌹\"];for(let i=0;i\u003cn;i++){const e=document.createElement(\"span\");e.className=\"hearts\";e.textContent=s[Math.random()*s.length|0];e.style.left=rnd(0,100)+\"vw\";e.style.top=rnd(35,95)+\"vh\";e.style.fontSize=rnd(16,40)+\"px\";e.style.animationDuration=rnd(2,4)+\"s\";document.body.appendChild(e);setTimeout(()=\u003ee.remove(),4500)}}\n\n/* ===== EMOJI KWENYE VICHWA (gradient) =====\n   Maandishi ya gradient hufunika emoji na kuzifanya madoa. Tunazifunga kwenye span ya .emo. */\nconst EMO=/\\p{Extended_Pictographic}[️‍\\u{1F3FB}-\\u{1F3FF}\\p{Extended_Pictographic}]*/gu;\nfunction fixEmo(){document.querySelectorAll(\"h1:not([data-e])\").forEach(h=\u003e{h.dataset.e=1;if(EMO.test(h.textContent)){EMO.lastIndex=0;h.innerHTML=h.innerHTML.replace(EMO,'\u003cspan class=\"emo\"\u003e$\u0026\u003c/span\u003e')}EMO.lastIndex=0})}\nnew MutationObserver(fixEmo).observe(document.body,{childList:true,subtree:true});fixEmo();\n\n\n// ===== DATA YA ZAWADI (inajazwa na app.py) =====\nconst CFG=__CFG__;\n\n// ===== MSAADA WA PAMOJA (maandishi, vitufe, sauti, mwisho) =====\n\nconst m=CFG.m,FB=[\"kila kitu tulichopitia pamoja\",\"moyo wako mwema\",\"kwamba tutaendelea pamoja\"];\nconst T=s=\u003es.replace(/\\{to\\}/g,CFG.to).replace(/\\{from\\}/g,CFG.from||\"Rafiki yako\").replace(/\\{m(\\d)\\}/g,(a,k)=\u003em[k-1]||FB[k-1]);\nconst app=$(\"app\"),ph=CFG.ph||[],ev=CFG.ev;\nconst st=document.documentElement.style;st.setProperty(\"--b1\",ev.th[0]);st.setProperty(\"--b2\",ev.th[1]);st.setProperty(\"--ac\",ev.th[2]);\nconst btn=(t,f,g)=\u003e{const b=document.createElement(\"button\");b.className=\"btn\"+(g?\" gh\":\"\");b.textContent=t;b.onclick=f;return b};\nlet au=null;\nfunction voice(){return btn(\"🎤 Sikiliza sauti yangu\",()=\u003e{if(!au)au=new Audio(CFG.au);if(bus)bus.gain.setTargetAtTime(.15,AC.currentTime,.2);au.onended=()=\u003e{if(bus)bus.gain.setTargetAtTime(1,AC.currentTime,.4)};au.play()},1)}\nconst heroH=()=\u003eph[0]?'\u003cimg class=\"hero\" src=\"'+ph[0]+'\"\u003e':\"\";\nfunction finale(h){\n  const Q=CFG.Q;h.innerHTML='\u003cdiv class=\"em\"\u003e'+ev.e+'\u003c/div\u003e'+heroH()+'\u003ch1\u003e'+T(Q.t)+'\u003c/h1\u003e\u003cp\u003e'+T(Q.p)+'\u003c/p\u003e';\n  h.appendChild(btn(T(Q.y),()=\u003e{fireworks(24);hearts(80);play(3);\n    h.innerHTML='\u003cdiv class=\"em\"\u003e🎆🎉🎆\u003c/div\u003e'+heroH()+'\u003ch1\u003eAsante, '+CFG.to+'! 💖\u003c/h1\u003e\u003cp\u003eZawadi hii imetoka moyoni mwa '+(CFG.from||\"mtumaji\")+'.\u003c/p\u003e';\n    h.appendChild(btn(\"🔁 Tazama tena\",()=\u003elocation.reload(),1));if(CFG.au)h.appendChild(voice());\n    setInterval(()=\u003e{fireworks(5);hearts(20)},5000)}));\n  if(Q.n){const n=btn(T(Q.n),()=\u003e{},1);h.appendChild(n);\n    if(ev.dodge){const mv=e=\u003e{e.preventDefault();n.style.transform=\"translate(\"+rnd(-100,100)+\"px,\"+rnd(-60,60)+\"px)\"};n.addEventListener(\"pointerenter\",mv);n.addEventListener(\"touchstart\",mv,{passive:false});n.onclick=mv}\n    else n.onclick=()=\u003etoast(\"Sawa, nitasubiri kwa subira 🙏\")}\n  if(CFG.au)h.appendChild(voice());\n}\n\n// ===== MTINDO: KITABU =====\nfunction book(){\n  const P=CFG.P.map(p=\u003ep.map(T));let i=0;\n  app.innerHTML='\u003cdiv class=\"box\"\u003e\u003cdiv id=\"pg\"\u003e\u003c/div\u003e\u003cdiv class=\"dots\" id=\"dt\"\u003e\u003c/div\u003e\u003cdiv class=\"row\" id=\"bw\"\u003e\u003cbutton class=\"btn gh\" id=\"bp\"\u003e◀\u003c/button\u003e\u003cbutton class=\"btn\" id=\"bn\"\u003e▶\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e';\n  const d=()=\u003e{const pg=$(\"pg\");if(i\u003e=P.length){$(\"bw\").style.display=\"none\";$(\"dt\").textContent=\"\";finale(pg);return}\n    const p=P[i];pg.innerHTML='\u003cdiv class=\"page\"\u003e\u003cdiv class=\"em\"\u003e'+p[0]+'\u003c/div\u003e'+(ph.length?'\u003cimg class=\"hero\" src=\"'+ph[i%ph.length]+'\"\u003e':\"\")+'\u003ch1\u003e'+p[1]+'\u003c/h1\u003e\u003cp\u003e'+p[2]+'\u003c/p\u003e\u003c/div\u003e';$(\"dt\").textContent=P.map((_,k)=\u003ek===i?\"●\":\"○\").join(\" \")};\n  $(\"bn\").onclick=()=\u003e{if(i\u003cP.length){i++;d();hearts(8);if(i===P.length)fireworks(5)}};$(\"bp\").onclick=()=\u003e{if(i\u003e0){i--;d()}};d();\n}\n\n// ===== KUANZA =====\nfunction begin(){$(\"st0\").style.display=\"none\";$(\"mute\").style.display=\"block\";play(0);book()}\n$(\"st0\").innerHTML='\u003cdiv style=\"font-size:64px\"\u003e'+ev.e+'\u003c/div\u003e\u003ch1\u003eUna zawadi, '+CFG.to+'\u003c/h1\u003e\u003cp style=\"max-width:300px\"\u003eWasha sauti kisha ufungue zawadi yako.\u003c/p\u003e';\n$(\"st0\").appendChild(btn(\"🎁 FUNGUA\",begin));\n\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n", "cards": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"sw\"\u003e\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"\u003e\n\u003ctitle\u003eZawadi kwa __TO__ __EV_E__\u003c/title\u003e\n\u003cstyle\u003e\n/* ===== MISINGI (inatumika na mitindo yote) ===== */\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{width:100%;height:100%;overflow:hidden}\nbody{font-family:Georgia,serif;color:#fff;background:radial-gradient(ellipse at 50% 15%,var(--b1),var(--b2) 60%,#05030a)}\n#stars{position:fixed;inset:0;pointer-events:none}\n.st{position:absolute;background:#fff;border-radius:50%;animation:tw 1.8s infinite alternate;opacity:.6}\n@keyframes tw{to{opacity:.15;transform:scale(.5)}}\n#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}\n#app{position:fixed;inset:0;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;z-index:2}\n.box{width:100%;max-width:440px;margin:auto;text-align:center;padding:22px 18px;border:1px solid #ffffff3a;border-radius:26px;background:#0000007a;box-shadow:0 10px 50px #000a,0 0 50px var(--ac);backdrop-filter:blur(10px);animation:pop .6s ease-out}\n@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}\nh1{font-size:clamp(28px,8.5vw,42px);margin:8px 0;line-height:1.2;background:linear-gradient(90deg,#ffd98a,#fff,#ffd98a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}\n@keyframes sh{to{background-position:-250% 0}}\np{font-size:clamp(15px,4.2vw,18px);line-height:1.8;color:#fff3ea}\n.em{font-size:clamp(40px,12vw,58px);margin:6px 0}\n.hero{display:block;width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #ffd98a;box-shadow:0 0 30px var(--ac);margin:8px auto}\n.btn{display:block;width:100%;max-width:320px;margin:14px auto 0;padding:14px 12px;border:2px solid #ffffff88;border-radius:50px;background:linear-gradient(100deg,var(--ac),#9d4edd);color:#fff;font:800 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 22px var(--ac)}\n.btn.gh{background:#ffffff18;box-shadow:none;font-weight:600}\n.hearts{position:fixed;pointer-events:none;z-index:65;animation:rise 3s ease-out forwards}\n@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-85vh) rotate(380deg) scale(1.4);opacity:0}}\n#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:80;width:38px;height:38px;border-radius:50%;border:1px solid #fff5;background:#0006;color:#fff;font-size:17px;cursor:pointer}\n#now{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;padding:6px 14px;border-radius:30px;background:#000a;font:12px system-ui,sans-serif;color:#ffe9a8;opacity:0;transition:opacity .5s;white-space:nowrap}\n#now.on{opacity:1}\n#st0{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,var(--b1),#05030a);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}\n\n/* ===== KADI ZA KUKWANGUA ===== */\n.tk{position:relative;margin:16px auto;width:100%;height:170px;border-radius:20px;background:linear-gradient(135deg,var(--b1),var(--b2));border:2px solid #ffd98a;overflow:hidden}\n.pz{position:absolute;inset:0;display:flex;align-items:center;gap:14px;padding:14px 18px;text-align:left}\n.pe{font-size:46px}.pz small{letter-spacing:3px;font-size:10px;opacity:.7}.pz h3{font-size:18px;color:#ffd98a;margin:3px 0}.pz p{font-size:13px;line-height:1.5}\ncanvas.f{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;transition:opacity .7s}\n.emo{display:inline-block;-webkit-text-fill-color:initial;color:#fff;background:none}\n\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv id=\"stars\"\u003e\u003c/div\u003e\u003ccanvas id=\"fw\"\u003e\u003c/canvas\u003e\n\u003cbutton id=\"mute\" type=\"button\" style=\"display:none\" aria-label=\"Sauti\"\u003e🔊\u003c/button\u003e\u003cdiv id=\"now\"\u003e\u003c/div\u003e\n\u003cdiv id=\"app\"\u003e\u003c/div\u003e\u003cdiv id=\"st0\"\u003e\u003c/div\u003e\n\u003cscript\u003e\n// ===== INJINI YA MUZIKI NA FATAKI (partials/engine.js) =====\n/* Injini ya muziki + fataki + mioyo. Inatumika na zawadi zote. */\nconst $=id=\u003edocument.getElementById(id);\nconst rnd=(a,b)=\u003ea+Math.random()*(b-a);\nfor(let i=0;i\u003c90;i++){const s=document.createElement(\"i\");s.className=\"st\";const z=rnd(1,3);Object.assign(s.style,{width:z+\"px\",height:z+\"px\",left:rnd(0,100)+\"%\",top:rnd(0,100)+\"%\",animationDelay:rnd(0,3)+\"s\"});$(\"stars\").appendChild(s)}\n\n/* ===== MUSIC ===== */\nconst TR=[\n {n:\"Mapenzi\",bpm:66,root:65,sc:[0,2,4,5,7,9,11],ch:[[53,57,60],[50,53,57],[58,62,65],[48,52,55]],arp:\"0.1.2.3.2.1.0.1.\",mel:\"x.....x...x.....\",aw:\"sine\",mw:\"triangle\",v:.07},\n {n:\"Ndoto Tamu\",bpm:72,root:69,sc:[0,3,5,7,10],ch:[[57,60,64],[53,57,60],[48,52,55],[52,55,59]],arp:\"0.1.2.1.3.2.1.0.\",mel:\"x...x.x.....x...\",aw:\"triangle\",mw:\"sine\",v:.05},\n {n:\"Lala Salama\",bpm:56,root:74,sc:[0,2,4,7,9],ch:[[57,61,64],[55,59,62],[59,62,66],[52,56,59]],arp:\"3.4.5.4.3.4.5.4.\",mel:\"x.......x.......\",aw:\"triangle\",mw:\"sine\",v:.06}\n];\nlet AC,master,dIn,nb,bus,timer,step=0,nextT=0,walk=0,muted=false,tn=0;\nconst mtof=m=\u003e440*Math.pow(2,(m-69)/12);\nfunction initA(){\n  AC=new(window.AudioContext||window.webkitAudioContext)();\n  master=AC.createGain();master.gain.value=.85;\n  const c=AC.createDynamicsCompressor();master.connect(c);c.connect(AC.destination);\n  const d=AC.createDelay(1);d.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.38;\n  const lp=AC.createBiquadFilter();lp.frequency.value=2600;\n  dIn=AC.createGain();dIn.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(master);\n  nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i\u003ca.length;i++)a[i]=Math.random()*2-1;\n}\nfunction note(f,t,d,ty,v,o,a=.015){const os=AC.createOscillator(),g=AC.createGain();os.type=ty;os.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o);os.start(t);os.stop(t+d+.05)}\nfunction noise(t,d,ty,fr,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=ty;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05)}\nfunction pstep(T,o,s,t){\n  const i=s%16,ch=T.ch[Math.floor(s/16)%4],b=60/T.bpm;\n  if(i===0){ch.forEach(m=\u003e{note(mtof(m),t,b*4,\"sine\",T.v*.8,o,.5);note(mtof(m+12),t,b*4,\"triangle\",T.v*.3,o,.6)});note(mtof(ch[0]-12),t,b*3,\"sine\",.2,o,.05)}\n  const a=T.arp[i];\n  if(a!==\".\"){const n=+a,m=ch[n%3]+12*(1+Math.floor(n/3));note(mtof(m),t,b*.9,T.aw,T.v,o);note(mtof(m),t+b*.33,b*.6,T.aw,T.v*.4,dIn)}\n  if(T.mel[i]===\"x\"){walk+=[-2,-1,1,2,0,1][Math.random()*6|0];walk=Math.max(0,Math.min(T.sc.length*2-1,walk));\n    const m=T.root+T.sc[walk%T.sc.length]+12*Math.floor(walk/T.sc.length);note(mtof(m),t,b*1.7,T.mw,T.v*1.3,o);note(mtof(m),t,b*1.7,T.mw,T.v*.7,dIn)}\n}\nfunction play(i){\n  if(!AC)initA();if(AC.state===\"suspended\")AC.resume();\n  const T=TR[i%TR.length],now=AC.currentTime;\n  if(bus){const ob=bus;ob.gain.setValueAtTime(ob.gain.value,now);ob.gain.linearRampToValueAtTime(0,now+1);setTimeout(()=\u003eob.disconnect(),1300)}\n  clearInterval(timer);\n  const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(1,now+1.2);g.connect(master);bus=g;\n  step=0;walk=2;nextT=now+.1;\n  timer=setInterval(()=\u003e{while(nextT\u003cAC.currentTime+.2){pstep(T,g,step,nextT+(step%2?.012:0));nextT+=60/T.bpm/4;step++}},25);\n  to y;os.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o);os.start(t);os.stop(t+d+.05)}\nfunction noise(t,d,ty,fr,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=ty;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05)}\nfunction pstep(T,o,s,t){\n  const i=s%16,ch=T.ch[Math.floor(s/16)%4],b=60/T.bpm;\n  if(i===0){ch.forEach(m=\u003e{note(mtof(m),t,b*4,\"sine\",T.v*.8,o,.5);note(mtof(m+12),t,b*4,\"triangle\",T.v*.3,o,.6)});note(mtof(ch[0]-12),t,b*3,\"sine\",.2,o,.05)}\n  const a=T.arp[i];\n  if(a!==\".\"){const n=+a,m=ch[n%3]+12*(1+Math.floor(n/3));note(mtof(m),t,b*.9,T.aw,T.v,o);note(mtof(m),t+b*.33,b*.6,T.aw,T.v*.4,dIn)}\n  if(T.mel[i]===\"x\"){walk+=[-2,-1,1,2,0,1][Math.random()*6|0];walk=Math.max(0,Math.min(T.sc.length*2-1,walk));\n    const m=T.root+T.sc[walk%T.sc.length]+12*Math.floor(walk/T.sc.length);note(mtof(m),t,b*1.7,T.mw,T.v*1.3,o);note(mtof(m),t,b*1.7,T.mw,T.v*.7,dIn)}\n}\nfunction play(i){\n  if(!AC)initA();if(AC.state===\"suspended\")AC.resume();\n  const T=TR[i%TR.length],now=AC.currentTime;\n  if(bus){const ob=bus;ob.gain.setValueAtTime(ob.gain.value,now);ob.gain.linearRampToValueAtTime(0,now+1);setTimeout(()=\u003eob.disconnect(),1300)}\n  clearInterval(timer);\n  const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(1,now+1.2);g.connect(master);bus=g;\n  step=0;walk=2;nextT=now+.1;\n  timer=setInterval(()=\u003e{while(nextT\u003cAC.currentTime+.2){pstep(T,g,step,nextT+(step%2?.012:0));nextT+=60/T.bpm/4;step++}},25);\n  toast(\"🎵 \"+T.n);\n}\nlet tt;function toast(m){const e=$(\"now\");e.textContent=m;e.classList.add(\"on\");clearTimeout(tt);tt=setTimeout(()=\u003ee.classList.remove(\"on\"),2500)}\n$(\"mute\").onclick=()=\u003e{muted=!muted;master.gain.setTargetAtTime(muted?0:.85,AC.currentTime,.05);$(\"mute\").textContent=muted?\"🔇\":\"🔊\"};\n\n/* ===== FIREWORKS ===== */\nconst fc=$(\"fw\"),fx=fc.getContext(\"2d\");let W,H,P=[],R=[],pend=0,run=false;\nfunction size(){const d=Math.min(devicePixelRatio||1,2);fc.width=innerWidth*d;fc.height=innerHeight*d;fx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}\naddEventListener(\"resize\",size);size();\nfunction boomS(){if(!AC||muted)return;const t=AC.currentTime;noise(t,.7,\"lowpass\",420,.5);const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+.4);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+.55);for(let k=0;k\u003c4;k++)noise(t+.15+Math.random()*.5,.04,\"highpass\",5000,.15)}\nfunction launch(){R.push({x:W*rnd(.15,.85),y:H,vx:rnd(-.6,.6),vy:-rnd(9,12),ty:H*rnd(.12,.45),h:rnd(0,360)})}\nfunction boom(x,y,hue){\n  const ty=[\"peony\",\"ring\",\"heart\",\"willow\",\"double\",\"crackle\",\"spiral\"][Math.random()*7|0],n=ty===\"heart\"?80:100;\n  const add=(vx,vy,h,o={})=\u003eP.push({x,y,px:x,py:y,vx,vy,l:1,d:o.d||rnd(.011,.019),g:o.g??.04,f:o.f||.972,h,w:o.w||2.2,tw:o.tw});\n  for(let i=0;i\u003cn;i++){const a=Math.PI*2*i/n,c=Math.cos(a),s=Math.sin(a);\n    if(ty===\"peony\"){const k=rnd(1.5,6);add(c*k,s*k,hue+rnd(0,30))}\n    else if(ty===\"ring\")add(c*5,s*5,hue,{f:.968});\n    else if(ty===\"heart\"){add(16*s*s*s*.3,-(13*c-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*.3,340+rnd(0,20),{f:.975,g:.02,d:.009,w:2.6})}\n    else if(ty===\"willow\"){const k=rnd(1,4.6);add(c*k,s*k,42,{g:.035,d:.005,f:.982,w:1.8})}\n    else if(ty===\"double\"){add(c*2.4,s*2.4,hue);add(c*5,s*5,hue+150)}\n    else if(ty===\"crackle\"){const k=rnd(1.5,6);add(c*k,s*k,hue,{tw:1,d:.01})}\n    else{const k=1+i/n*5,b=a*3;add(Math.cos(b)*k,Math.sin(b)*k,hue+i*3,{f:.97})}}\n  boomS();\n}\nfunction loop(){\n  fx.globalCompositeOperation=\"destination-out\";fx.fillStyle=\"rgba(0,0,0,.2)\";fx.fillRect(0,0,W,H);\n  fx.globalCompositeOperation=\"lighter\";fx.lineCap=\"round\";\n  for(let i=R.length-1;i\u003e=0;i--){const r=R[i],px=r.x,py=r.y;r.x+=r.vx;r.y+=r.vy;r.vy*=.985;\n    fx.strokeStyle=\"hsla(40,100%,75%,.9)\";fx.lineWidth=2.5;fx.beginPath();fx.moveTo(px,py);fx.lineTo(r.x,r.y);fx.stroke();\n    P.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:rnd(-.3,.3),vy:rnd(0,.6),l:.6,d:.04,g:.02,f:.95,h:35,w:1.4});\n    if(r.y\u003c=r.ty||r.vy\u003e-1.5){boom(r.x,r.y,r.h);R.splice(i,1)}}\n  for(let i=P.length-1;i\u003e=0;i--){const p=P[i];p.px=p.x;p.py=p.y;p.vx*=p.f;p.vy*=p.f;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;\n    if(p.l\u003c=0){P.splice(i,1);continue}\n    const a=p.tw\u0026\u0026Math.random()\u003c.4?.1:Math.min(1,p.l*1.4);\n    fx.strokeStyle=\"hsla(\"+p.h+\",100%,\"+(55+p.l*25)+\"%,\"+a+\")\";fx.lineWidth=p.w*p.l+.4;fx.beginPath();fx.moveTo(p.px,p.py);fx.lineTo(p.x,p.y);fx.stroke()}\n  if(R.length||P.length||pend\u003e0)requestAnimationFrame(loop);else{fx.clearRect(0,0,W,H);run=false}\n}\nfunction fireworks(n=7){size();for(let k=0;k\u003cn;k++){pend++;setTimeout(()=\u003e{launch();pend--},k*380+rnd(0,250))}if(!run){run=true;requestAnimationFrame(loop)}}\nfunction hearts(n=30){const s=[\"💖\",\"🌸\",\"✨\",\"⭐\",\"🎉\",\"💙\",\"🌹\"];for(let i=0;i\u003cn;i++){const e=document.createElement(\"span\");e.className=\"hearts\";e.textContent=s[Math.random()*s.length|0];e.style.left=rnd(0,100)+\"vw\";e.style.top=rnd(35,95)+\"vh\";e.style.fontSize=rnd(16,40)+\"px\";e.style.animationDuration=rnd(2,4)+\"s\";document.body.appendChild(e);setTimeout(()=\u003ee.remove(),4500)}}\n\n/* ===== EMOJI KWENYE VICHWA (gradient) =====\n   Maandishi ya gradient hufunika emoji na kuzifanya madoa. Tunazifunga kwenye span ya .emo. */\nconst EMO=/\\p{Extended_Pictographic}[️‍\\u{1F3FB}-\\u{1F3FF}\\p{Extended_Pictographic}]*/gu;\nfunction fixEmo(){document.querySelectorAll(\"h1:not([data-e])\").forEach(h=\u003e{h.dataset.e=1;if(EMO.test(h.textContent)){EMO.lastIndex=0;h.innerHTML=h.innerHTML.replace(EMO,'\u003cspan class=\"emo\"\u003e$\u0026\u003c/span\u003e')}EMO.lastIndex=0})}\nnew MutationObserver(fixEmo).observe(document.body,{childList:true,subtree:true});fixEmo();\n\n\n// ===== DATA YA ZAWADI (inajazwa na app.py) =====\nconst CFG=__CFG__;\n\n// ===== MSAADA WA PAMOJA (maandishi, vitufe, sauti, mwisho) =====\n\nconst m=CFG.m,FB=[\"kila kitu tulichopitia pamoja\",\"moyo wako mwema\",\"kwamba tutaendelea pamoja\"];\nconst T=s=\u003es.replace(/\\{to\\}/g,CFG.to).replace(/\\{from\\}/g,CFG.from||\"Rafiki yako\").replace(/\\{m(\\d)\\}/g,(a,k)=\u003em[k-1]||FB[k-1]);\nconst app=$(\"app\"),ph=CFG.ph||[],ev=CFG.ev;\nconst st=document.documentElement.style;st.setProperty(\"--b1\",ev.th[0]);st.setProperty(\"--b2\",ev.th[1]);st.setProperty(\"--ac\",ev.th[2]);\nconst btn=(t,f,g)=\u003e{const b=document.createElement(\"button\");b.className=\"btn\"+(g?\" gh\":\"\");b.textContent=t;b.onclick=f;return b};\nlet au=null;\nfunction voice(){return btn(\"🎤 Sikiliza sauti yangu\",()=\u003e{if(!au)au=new Audio(CFG.au);if(bus)bus.gain.setTargetAtTime(.15,AC.currentTime,.2);au.onended=()=\u003e{if(bus)bus.gain.setTargetAtTime(1,AC.currentTime,.4)};au.play()},1)}\nconst heroH=()=\u003eph[0]?'\u003cimg class=\"hero\" src=\"'+ph[0]+'\"\u003e':\"\";\nfunction finale(h){\n  const Q=CFG.Q;h.innerHTML='\u003cdiv class=\"em\"\u003e'+ev.e+'\u003c/div\u003e'+heroH()+'\u003ch1\u003e'+T(Q.t)+'\u003c/h1\u003e\u003cp\u003e'+T(Q.p)+'\u003c/p\u003e';\n  h.appendChild(btn(T(Q.y),()=\u003e{fireworks(24);hearts(80);play(3);\n    h.innerHTML='\u003cdiv class=\"em\"\u003e🎆🎉🎆\u003c/div\u003e'+heroH()+'\u003ch1\u003eAsante, '+CFG.to+'! 💖\u003c/h1\u003e\u003cp\u003eZawadi hii imetoka moyoni mwa '+(CFG.from||\"mtumaji\")+'.\u003c/p\u003e';\n    h.appendChild(btn(\"🔁 Tazama tena\",()=\u003elocation.reload(),1));if(CFG.au)h.appendChild(voice());\n    setInterval(()=\u003e{fireworks(5);hearts(20)},5000)}));\n  if(Q.n){const n=btn(T(Q.n),()=\u003e{},1);h.appendChild(n);\n    if(ev.dodge){const mv=e=\u003e{e.preventDefault();n.style.transform=\"translate(\"+rnd(-100,100)+\"px,\"+rnd(-60,60)+\"px)\"};n.addEventListener(\"pointerenter\",mv);n.addEventListener(\"touchstart\",mv,{passive:false});n.onclick=mv}\n    else n.onclick=()=\u003etoast(\"Sawa, nitasubiri kwa subira 🙏\")}\n  if(CFG.au)h.appendChild(voice());\n}\n\n// ===== MTINDO: SIMU =====\nfunction phone(){\n  const P=CFG.P.map(p=\u003ep.map(T));\n  app.style.padding=\"0\";\n  app.innerHTML='\u003cdiv id=\"phn\"\u003e\u003cdiv id=\"lk\"\u003e\u003cdiv id=\"tm\"\u003e\u003c/div\u003e\u003cdiv id=\"nts\"\u003e\u003c/div\u003e\u003cdiv id=\"hn\"\u003e👆 Gusa ujumbe kuufungua\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"ch\" style=\"display:none\"\u003e\u003cdiv class=\"hd\"\u003e\u003cb\u003e'+(CFG.from||\"Rafiki yako\")+' '+ev.e+'\u003c/b\u003e\u003cspan id=\"ss\"\u003emtandaoni\u003c/span\u003e\u003c/div\u003e\u003cdiv id=\"ms\"\u003e\u003c/div\u003e\u003cdiv id=\"rp\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"cc\" style=\"display:none\"\u003e\u003c/div\u003e\u003c/div\u003e';\n  if(ph[0])$(\"lk\").style.backgroundImage=\"url(\"+ph[0]+\")\";\n  const n=new Date();$(\"tm\").textContent=String(n.getHours()).padStart(2,\"0\")+\":\"+String(n.getMinutes()).padStart(2,\"0\");\n  const ping=()=\u003e{if(AC\u0026\u0026!muted){const t=AC.currentTime;note(mtof(91),t,.25,\"sine\",.18,master);note(mtof(96),t+.12,.3,\"sine\",.14,master)}};\n  const vib=p=\u003e{try{navigator.vibrate\u0026\u0026navigator.vibrate(p)}catch(e){}};\n  let opened=false;\n  function open(){if(opened)return;opened=true;$(\"lk\").style.display=\"none\";$(\"ch\").style.display=\"flex\";hearts(8);setTimeout(nx,900)}\n  P.slice(0,3).forEach((p,k)=\u003esetTimeout(()=\u003e{const d=document.createElement(\"div\");d.className=\"nt\";d.innerHTML=\"\u003ci\u003e\"+p[0]+\"\u003c/i\u003e\u003cdiv\u003e\u003cb\u003e\"+(CFG.from||\"Rafiki yako\")+\"\u003c/b\u003e\u003cspan\u003e\"+p[2].slice(0,60)+\"…\u003c/span\u003e\u003c/div\u003e\";d.onclick=open;$(\"nts\").appendChild(d);ping();vib(k?[80]:[200,100,200])},900+k*1300));\n  const add=(c,h)=\u003e{const b=document.createElement(\"div\");b.className=\"b \"+c;b.innerHTML=h;$(\"ms\").appendChild(b);$(\"ms\").scrollTop=1e6;if(c===\"h\")ping();return b};\n  let i=0;const R=[[\"Aww 🥹\",\"Asante sana 💙\"],[\"Nimeguswa 😭\",\"Nakupenda pia ❤️\"],[\"Amina 🙏\",\"Wow 😍\"]];\n  function nx(){\n    if(i\u003e=P.length){if(CFG.au){const b=add(\"h\",\"🎤 Ujumbe wa sauti\");b.appendChild(voice());setTimeout(ring,6000)}else setTimeout(ring,1500);return}\n    const p=P[i++];$(\"ss\").textContent=\"anaandika...\";\n    setTimeout(()=\u003e{$(\"ss\").textContent=\"mtandaoni\";add(\"h\",p[0]+\" \u003cb\u003e\"+p[1]+\"\u003c/b\u003e\u003cbr\u003e\"+p[2]);\n      if(i%2===0\u0026\u0026i\u003cP.length){R[(i/2-1)%3].forEach(x=\u003e{const b=document.createElement(\"button\");b.textContent=x;b.onclick=()=\u003e{$(\"rp\").innerHTML=\"\";add(\"me\",x);hearts(5);setTimeout(nx,700)};$(\"rp\").appendChild(b)})}\n      else setTimeout(nx,1100)},800+p[2].length*14);\n  }\n  let rg;\n  function ring(){\n    $(\"ch\").style.display=\"none\";$(\"cc\").style.display=\"flex\";\n    if(bus){bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}clearInterval(timer);\n    $(\"cc\").innerHTML=heroH()+'\u003ch1\u003e'+(CFG.from||\"Rafiki yako\")+' anapiga simu...\u003c/h1\u003e\u003cdiv class=\"cb\"\u003e\u003cbutton style=\"background:#ff3b5c\" id=\"dc\"\u003e📵\u003c/button\u003e\u003cbutton style=\"background:#25d366\" id=\"ac\"\u003e📞\u003c/button\u003e\u003c/div\u003e';\n    const r=()=\u003e{if(AC\u0026\u0026!muted){const t=AC.currentTime;[0,.22,.5,.72].forEach((d,k)=\u003enote(mtof(k%2?84:79),t+d,.18,\"triangle\",.25,master))}vib([400,200,400])};r();rg=setInterval(r,2000);\n    $(\"dc\").onclick=()=\u003etoast(\"Jibu simu, ni muhimu! 😄\");\n    $(\"ac\").onclick=()=\u003e{clearInterval(rg);play(1);const h=$(\"cc\");finale(h)};\n  }\n}\n\n// ===== KUANZA =====\nfunction begin(){$(\"st0\").style.display=\"none\";$(\"mute\").style.display=\"block\";play(0);phone()}\n$(\"st0\").innerHTML='\u003cdiv style=\"font-size:64px\"\u003e'+ev.e+'\u003c/div\u003e\u003ch1\u003eUna zawadi, '+CFG.to+'\u003c/h1\u003e\u003cp style=\"max-width:300px\"\u003eWasha sauti kisha ufungue zawadi yako.\u003c/p\u003e';\n$(\"st0\").appendChild(btn(\"🎁 FUNGUA\",begin));\n\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n"};

  const toRaw=String(d.to||"").trim().slice(0,40);if(!toRaw)throw new Error("Andika jina la mpokeaji.");
  const ph=(d.ph||[]).slice(0,3).filter(p=>typeof p==="string"&&p.length<=1200000&&IMG_RE.test(p));
  const au=(typeof d.au==="string"&&d.au.length<=3000000&&AUD_RE.test(d.au))?d.au:null;
  const m=(d.m||[]).slice(0,3).map(x=>clean(x,300));while(m.length<3)m.push("");
  const cfg={to:clean(toRaw,40),from:clean(d.from,40),m:m,ph:ph,au:au,ev:{e:e.e,th:e.th,dodge:e.dodge||0},P:e.P,C:e.C,Q:e.Q};
  const j=JSON.stringify(cfg).replace(/&/g,"\\u0026").replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
  const map={"__CFG__":j,"__TO__":clean(toRaw,40),"__EV_E__":e.e};
  return TPL[st.id].replace(/__CFG__|__TO__|__EV_E__/g,k=>map[k]);
}
const $=id=>document.getElementById(id);
let ev=null,photos=[],audio=null,mode=STY[0].id,html="",fname="zawadi.html";
EV.forEach((e,i)=>{const b=document.createElement("button");b.className="ev";b.innerHTML="<b>"+e.e+"</b>"+e.n;b.onclick=()=>pick(i);$("evs").appendChild(b)});
STY.forEach((s,i)=>{const b=document.createElement("button");b.className="ev"+(i?"":" on");b.innerHTML="<b>"+s.e+"</b>"+s.n+"<br><small>"+s.d+"</small>";b.onclick=()=>{mode=s.id;[...$("sty").children].forEach(x=>x.classList.remove("on"));b.classList.add("on")};$("sty").appendChild(b)});
function pick(i){
  ev=EV[i];[...$("evs").children].forEach((b,k)=>b.classList.toggle("on",k===i));
  ["f0","f1","f2"].forEach((id,k)=>{$(id).parentNode.firstChild.nodeValue=ev.f[k]+" (hiari)"});
  $("form").classList.remove("hide");$("form").scrollIntoView({behavior:"smooth"});
}
$("ph").onchange=async e=>{photos=[];$("pv").innerHTML="";for(const f of [...e.target.files].slice(0,3)){const u=await shrink(f);photos.push(u);const im=new Image();im.src=u;$("pv").appendChild(im)}};
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};im.src=URL.createObjectURL(f)})}
$("au").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6){alert("Sauti ni kubwa mno. Chagua rekodi fupi (chini ya sekunde 60).");e.target.value="";return}const r=new FileReader();r.onload=()=>{audio=r.result;if(!/^data:audio\//.test(audio))audio=audio.replace(/^data:[^;,]*/,"data:audio/mpeg")};r.readAsDataURL(f)};
$("go").onclick=async()=>{
  if(!ev){alert("Chagua tukio kwanza");return}
  const to=$("to").value.trim();if(!to){alert("Andika jina la mpokeaji");$("to").focus();return}

};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=fname;document.body.appendChild(a);a.click();a.remove()};
$("sh").onclick=async()=>{const f=new File([html],fname,{type:"text/html"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Zawadi kwako"});else alert("Kifaa chako hakiruhusu kushiriki moja kwa moja. Tumia 'Pakua faili', kisha utume kwa WhatsApp.")}catch(e){}};
